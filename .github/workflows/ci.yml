name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Check Python
      - name: Check Python Version
        run: |
          python3 --version

      # 3. Create virtual environment
      - name: Create Virtual Environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # 5. Run tests
      - name: Run Unit Tests
        run: |
          source venv/bin/activate
          pytest -v

      # 6. SonarQube
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 7. Snyk Python dependency scan
      - name: Snyk Python Dependency Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --package-manager=pip

      # 8. Build Docker image
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t devsecops-flask-app:${{ github.sha }} .

      # 9. Snyk Docker image scan
      - name: Snyk Docker Image Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            devsecops-flask-app:${{ github.sha }} \
            --file=Dockerfile \
            --severity-threshold=high

      # 10. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            adityat0919/devsecops-flask-app:${{ github.sha }}

          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            adityat0919/devsecops-flask-app:latest

      # 12. Push Docker image
      - name: Push Docker Image
        run: |
          docker push \
            adityat0919/devsecops-flask-app:${{ github.sha }}

          docker push \
            adityat0919/devsecops-flask-app:latest