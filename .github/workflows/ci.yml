name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Check Python
      - name: Check Python Version
        run: |
          python3 --version

      # 3. Create virtual environment
      - name: Create Virtual Environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      # 4. Install Python dependencies
      - name: Install Dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # 5. Run unit tests
      - name: Run Unit Tests
        run: |
          source venv/bin/activate
          pytest -v

      # 6. SonarQube Cloud analysis
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 7. Snyk Python dependency scan
      - name: Snyk Dependency Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip

      # 8. Build Docker image
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t devsecops-flask-app:${{ github.sha }} .

      # 9. Snyk Docker container scan
      - name: Scan Docker Image with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            devsecops-flask-app:${{ github.sha }} \
            --file=Dockerfile \
            --severity-threshold=high