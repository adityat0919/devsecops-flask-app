name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 2. Python
      # --------------------------------
      - name: Check Python Version
        run: |
          python3 --version
          pip3 --version

      # --------------------------------
      # 3. Virtual Environment
      # --------------------------------
      - name: Create Virtual Environment
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip

      # --------------------------------
      # 4. Install Dependencies
      # --------------------------------
      - name: Install Dependencies
        run: |
          ./venv/bin/pip install -r requirements.txt

      # --------------------------------
      # 5. Unit Tests
      # --------------------------------
      - name: Run Unit Tests
        run: |
          ./venv/bin/pytest -v

      # --------------------------------
      # 6. SonarQube Cloud
      # --------------------------------
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --------------------------------
      # 7. Snyk Python Dependency Scan
      # --------------------------------
      - name: Snyk Dependency Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=requirements.txt --package-manager=pip

      # --------------------------------
      # 8. Build Docker Image
      # --------------------------------
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t devsecops-flask-app:${{ github.sha }} .

      # --------------------------------
      # 9. Snyk Docker Container Scan
      # --------------------------------
      - name: Snyk Container Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            devsecops-flask-app:${{ github.sha }} \
            --file=Dockerfile \
            --severity-threshold=high

      # --------------------------------
      # 10. Docker Hub Login
      # --------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------
      # 11. Tag Docker Hub Image
      # --------------------------------
      - name: Tag Docker Hub Image
        run: |
          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:${{ github.sha }}

          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:latest

      # --------------------------------
      # 12. Push Docker Hub Image
      # --------------------------------
      - name: Push Docker Hub Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:latest

      # --------------------------------
      # 13. Login to Amazon ECR
      # --------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            565393055534.dkr.ecr.ap-south-1.amazonaws.com

      # --------------------------------
      # 14. Tag Image for ECR
      # --------------------------------
      - name: Tag Image for ECR
        run: |
          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            565393055534.dkr.ecr.ap-south-1.amazonaws.com/devsecops-flask-app:${{ github.sha }}

      # --------------------------------
      # 15. Push Image to ECR
      # --------------------------------
      - name: Push Image to ECR
        run: |
          docker push \
            565393055534.dkr.ecr.ap-south-1.amazonaws.com/devsecops-flask-app:${{ github.sha }}

      # --------------------------------
      # 16. Update Kubernetes Deployment
      # --------------------------------
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name devsecops-cluster

          kubectl set image deployment/devsecops-flask-app \
            flask-app=565393055534.dkr.ecr.ap-south-1.amazonaws.com/devsecops-flask-app:${{ github.sha }}

      # --------------------------------
      # 17. Wait for Kubernetes Rollout
      # --------------------------------
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/devsecops-flask-app --timeout=5m

      # --------------------------------
      # 18. Verify Kubernetes
      # --------------------------------
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get deployment
          kubectl get service
