name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 2. Python
      # --------------------------------
      - name: Check Python Version
        run: |
          python3 --version
          pip3 --version

      # --------------------------------
      # 3. Virtual Environment
      # --------------------------------
      - name: Create Virtual Environment
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip

      # --------------------------------
      # 4. Install Dependencies
      # --------------------------------
      - name: Install Dependencies
        run: |
          ./venv/bin/pip install -r requirements.txt

      # --------------------------------
      # 5. Unit Tests
      # --------------------------------
      - name: Run Unit Tests
        run: |
          ./venv/bin/pytest -v

      # --------------------------------
      # 6. SonarQube Cloud
      # --------------------------------
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --------------------------------
      # 7. Snyk Python Dependency Scan
      # --------------------------------
      - name: Snyk Dependency Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=requirements.txt --package-manager=pip

      # --------------------------------
      # 8. Build Docker Image
      # --------------------------------
      - name: Build Docker Image
        run: |
          docker build --pull \
            -t devsecops-flask-app:${{ github.sha }} .

      # --------------------------------
      # 9. Snyk Docker Container Scan
      # --------------------------------
      - name: Snyk Container Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            devsecops-flask-app:${{ github.sha }} \
            --file=Dockerfile \
            --severity-threshold=high

      # --------------------------------
      # 10. Docker Hub Login
      # --------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------
      # 11. Tag Docker Image
      # --------------------------------
      - name: Tag Docker Image
        run: |
          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:${{ github.sha }}

          docker tag \
            devsecops-flask-app:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:latest

      # --------------------------------
      # 12. Push Docker Image
      # --------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-flask-app:latest